/* ============================================================

/* ---------- 시간 포맷 / 비교 헬퍼 ---------- */
const fmtMin = (sec) => sec < 60 ? Math.max(0, Math.round(sec)) + '초' : Math.round(sec / 60) + '분';
const fmtClock = (sec) => { sec = Math.floor(Math.max(0, sec)); const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + String(s).padStart(2, '0'); };
// 실제 누적 초(진행 중이면 라이브 반영)
const liveSec = (t, nowMs) => (t.actualSec || 0) + (t.timerStart ? Math.max(0, (nowMs - t.timerStart) / 1000) : 0);
// 예상 대비 비교 문구
const diffLabel = (estSec, actSec) => {
  const d = actSec - estSec;
  if (Math.abs(d) < 30) return { text: '딱 맞았어 ✨', color: '#5AB98A' };
  if (d < 0) return { text: fmtMin(-d) + ' 빨리 🎉', color: '#5AB98A' };
  return { text: fmtMin(d) + ' 더 걸림', color: '#E0912B' };
};

/* ---------- localStorage 어댑터 ---------- */
function makeLocalStore(coupleId) {
  const KEY = 'couple52_48:' + coupleId;
  const read = () => {
    try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; }
  };
  const write = (arr) => localStorage.setItem(KEY, JSON.stringify(arr));
  let cache = read() || [];
  const subs = new Set();
  const emit = () => subs.forEach(fn => fn(cache.slice().sort((a, b) => a.order - b.order)));
  return {
    mode: 'local',
    subscribe(fn) { subs.add(fn); emit(); return () => subs.delete(fn); },
    add(todo) { cache = [{ id: 'l' + Date.now(), order: Date.now(), ...todo }, ...cache]; write(cache); emit(); },
    update(id, patch) { cache = cache.map(t => t.id === id ? { ...t, ...patch } : t); write(cache); emit(); },
    remove(id) { cache = cache.filter(t => t.id !== id); write(cache); emit(); },
  };
}

/* ---------- Firestore 어댑터 ---------- */
function makeFirestore(coupleId) {
  const col = db.collection('couples').doc(coupleId).collection('todos');
  return {
    mode: 'cloud',
    subscribe(fn) {
      return col.orderBy('order', 'asc').onSnapshot(
        (snap) => fn(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
        (err) => console.error('onSnapshot 에러:', err)
      );
    },
    add(todo) { return col.add({ ...todo, order: Date.now(), createdAt: Date.now() }); },
    update(id, patch) { return col.doc(id).update(patch); },
    remove(id) { return col.doc(id).delete(); },
  };
}

/* ============================================================

function CheckBox({ done, owner, size = 30, onClick }) {
  const mt = meta(owner);
  const style = {
    width: size, height: size, flex: '0 0 auto', borderRadius: 10, cursor: 'pointer',
    display: 'flex', alignItems: 'center', justifyContent: 'center', transition: '.2s',
    background: done ? mt.ring : '#fff',
    border: done ? `2px solid ${mt.ring}` : `2.5px solid ${mt.ring}`,
  };
  return (
    <div onClick={onClick} style={style}>
      {done && <span style={{ color: '#fff', fontSize: size * 0.57, animation: 'check-pop .35s ease' }}>✓</span>}
    </div>
  );
}

function titleStyle(done) {
  return {
    fontFamily: "'Gowun Dodum'", fontSize: 15, minWidth: 0, wordBreak: 'break-word',
    color: done ? '#C3BBCF' : '#514B5E', textDecoration: done ? 'line-through' : 'none',
  };
}

/* ---------- 홈: 사람별 카드 안의 한 항목 ---------- */
function TodoCard({ t, nowMs, onToggle, onLike, onHelp, onStartTimer, onStopTimer, onEdit, onDelete }) {
  const canHelp = t.owner === 'mina' && !t.done && !t.needHelp;
  const mt = meta(t.owner);
  const running = !!t.timerStart;
  const cur = liveSec(t, nowMs || Date.now());
  const hasActual = cur > 0;
  const diff = (t.estMin && hasActual && !running) ? diffLabel(t.estMin * 60, cur) : null;

  const [editing, setEditing] = useState(false);
  const [eTitle, setETitle] = useState('');
  const [eEst, setEEst] = useState('');
  const startEdit = () => { setETitle(t.title); setEEst(t.estMin || ''); setEditing(true); };
  const saveEdit = () => {
    const est = parseInt(eEst, 10);
    onEdit(t, { title: (eTitle || '').trim() || t.title, estMin: est > 0 ? est : null });
    setEditing(false);
  };
  const delEdit = () => {
    if (typeof window !== 'undefined' && window.confirm && !window.confirm('이 할 일을 삭제할까요?')) return;
    onDelete(t);
  };

  if (editing) {
    return (
      <div style={{ background: '#fff', borderRadius: 18, padding: '12px 13px', margin: 6, boxShadow: '0 4px 12px rgba(150,120,170,.08)', border: `2px solid ${mt.ring}` }}>
        <input
          autoFocus value={eTitle}
          onChange={(e) => setETitle(e.target.value)}
          onKeyDown={(e) => { if (e.key === 'Enter') saveEdit(); if (e.key === 'Escape') setEditing(false); }}
          style={{ width: '100%', border: 'none', outline: 'none', fontSize: 15, color: '#514B5E', background: 'transparent' }}
        />
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 9 }}>
          <span style={{ fontSize: 12, color: '#8a7f98' }}>⏱ 예상</span>
          <input
            type="number" min="1" inputMode="numeric" value={eEst}
            onChange={(e) => setEEst(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter') saveEdit(); }}
            placeholder="–"
            style={{ width: 46, border: '1.5px solid #F0E7DF', borderRadius: 10, padding: '4px 6px', fontSize: 13, color: '#514B5E', outline: 'none', textAlign: 'center' }}
          />
          <span style={{ fontSize: 12, color: '#8a7f98' }}>분</span>
          <button onClick={delEdit} style={{ marginLeft: 'auto', background: 'none', border: 'none', color: '#D66', fontSize: 12, cursor: 'pointer', padding: '5px 6px' }}>🗑 삭제</button>
          <button onClick={() => setEditing(false)} style={{ background: 'none', border: 'none', color: '#B7AEC4', fontSize: 12, cursor: 'pointer', padding: '5px 6px' }}>취소</button>
          <button onClick={saveEdit} style={{ background: mt.ring, border: 'none', color: '#fff', fontSize: 13, padding: '7px 14px', borderRadius: 14, cursor: 'pointer' }}>저장</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ background: '#fff', borderRadius: 18, padding: '12px 13px', margin: 6,
      boxShadow: '0 4px 12px rgba(150,120,170,.08)',
      border: running ? `2px solid ${mt.ring}` : (t.needHelp ? '2px solid #FFD6E2' : '2px solid transparent') }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 11 }}>
        <CheckBox done={t.done} owner={t.owner} onClick={() => onToggle(t)} />
        <span style={{ ...titleStyle(t.done), flex: 1 }}>{t.title}</span>
        {t.streak > 0 && <span style={{ fontSize: 12, color: '#E0912B' }}>🔥{t.streak}</span>}
        <button onClick={startEdit} title="수정" style={{ background: 'none', border: 'none', color: '#C9C1D4', fontSize: 13, cursor: 'pointer', padding: '2px 4px', flex: '0 0 auto' }}>✏️</button>
      </div>

      {/* 시간: 예상 · 실제 · 비교 + 타이머 */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 9, flexWrap: 'wrap' }}>
        {t.estMin ? <span style={{ background: '#EEF0F6', color: '#6E7A9B', fontSize: 11, padding: '3px 8px', borderRadius: 20 }}>⏱ 예상 {t.estMin}분</span> : null}
        {hasActual ? <span style={{ background: running ? '#FFE7EE' : '#F1ECF4', color: running ? '#E85D8A' : '#7d738c', fontSize: 11, fontWeight: 'bold', padding: '3px 8px', borderRadius: 20 }}>{running ? '▶ ' : '실제 '}{fmtClock(cur)}</span> : null}
        {diff ? <span style={{ color: diff.color, fontSize: 11, fontWeight: 'bold' }}>{diff.text}</span> : null}
        {!t.done && (
          running
            ? <button onClick={() => onStopTimer(t)} style={{ marginLeft: 'auto', background: '#FFE1E7', border: 'none', color: '#E85D8A', fontSize: 11, fontWeight: 'bold', padding: '5px 11px', borderRadius: 14, cursor: 'pointer' }}>⏹ 끝</button>
            : <button onClick={() => onStartTimer(t)} style={{ marginLeft: 'auto', background: '#E9F6EE', border: 'none', color: '#3E9E63', fontSize: 11, fontWeight: 'bold', padding: '5px 11px', borderRadius: 14, cursor: 'pointer' }}>{hasActual ? '▶ 이어서' : '▶ 시작'}</button>
        )}
      </div>

      {/* 응원 / 도움요청 */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginTop: 9, flexWrap: 'wrap' }}>
        {t.needHelp && <span style={{ background: '#FFE1E7', color: '#E85D8A', fontSize: 11, fontWeight: 'bold', padding: '3px 8px', borderRadius: 20 }}>🆘 도와줘!</span>}
        {(t.reactions || []).map((r, i) => <span key={i} style={{ fontSize: 14 }}>{r}</span>)}
        <button onClick={() => onLike(t)} style={{ marginLeft: 'auto', background: '#FFF0F4', border: 'none', color: '#E85D8A', fontSize: 11, padding: '5px 10px', borderRadius: 14, cursor: 'pointer' }}>💖</button>
        {canHelp && <button onClick={() => onHelp(t)} style={{ background: '#EAF4FB', border: 'none', color: '#3D8FC0', fontSize: 11, padding: '5px 10px', borderRadius: 14, cursor: 'pointer' }}>🙋</button>}
      </div>
    </div>
  );
}

                    onKeyDown={(e) => { if (e.key === 'Enter') submitAdd(g.owner); if (e.key === 'Escape') { setAddingOwner(null); setAddText(''); setAddEst(''); } }}
                    placeholder={`${mt.who}의 새 할 일`}
                    style={{ width: '100%', border: 'none', outline: 'none', fontSize: 15, color: '#514B5E', background: 'transparent' }}
                  />
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 8 }}>
                    <span style={{ fontSize: 12, color: '#8a7f98' }}>⏱ 예상</span>
                    <input
                      type="number" min="1" inputMode="numeric"
                      value={addEst}
                      onChange={(e) => setAddEst(e.target.value)}
                      onKeyDown={(e) => { if (e.key === 'Enter') submitAdd(g.owner); }}
                      placeholder="–"
                      style={{ width: 46, border: '1.5px solid #F0E7DF', borderRadius: 10, padding: '4px 6px', fontSize: 13, color: '#514B5E', outline: 'none', textAlign: 'center' }}
                    />
                    <span style={{ fontSize: 12, color: '#8a7f98' }}>분</span>
                    <button onClick={() => { setAddingOwner(null); setAddText(''); setAddEst(''); }} style={{ marginLeft: 'auto', background: 'none', border: 'none', color: '#B7AEC4', fontSize: 16, cursor: 'pointer', padding: '4px 6px' }}>✕</button>
                    <button onClick={() => submitAdd(g.owner)} style={{ background: mt.ring, border: 'none', color: '#fff', fontSize: 13, padding: '7px 14px', borderRadius: 14, cursor: 'pointer' }}>추가</button>
                  </div>
                </div>
              ) : (
                <button
                  onClick={() => { setAddingOwner(g.owner); setAddText(''); }}
                  style={{ display: 'block', width: 'calc(100% - 12px)', boxSizing: 'border-box', margin: 6, padding: '11px', borderRadius: 16, border: `2px dashed ${mt.ring}`, background: 'transparent', color: mt.ink, fontSize: 13, cursor: 'pointer' }}>
                  ＋ 할 일 추가
                </button>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function StatsScreen({ todos, nowMs, fullDateLabel }) {
  const groupOrder = ['mina', 'minseong', 'both'];
  const groups = groupOrder
    .map(o => ({ owner: o, items: todos.filter(t => t.owner === o) }))
    .filter(g => g.items.length > 0);

  const personMsg = (p) =>
    p === 100 ? '다 끝냈어! 🏆' : p >= 50 ? '절반 넘었어 💪' : p > 0 ? '하나씩 해나가는 중 🌱' : '오늘도 천천히 시작해보자 🌱';

  // 예상 vs 실제: 예상시간이 있고 실제 기록이 시작된 항목 — 사람별로 묶음
  const timedGroups = groupOrder.map(o => {
    const items = todos
      .filter(t => t.owner === o && t.estMin && liveSec(t, nowMs) > 0)
      .map(t => ({ t, est: t.estMin * 60, act: liveSec(t, nowMs) }));
    const est = items.reduce((s, x) => s + x.est, 0);
    const act = items.reduce((s, x) => s + x.act, 0);
    return { owner: o, items, est, act, overall: est > 0 ? diffLabel(est, act) : null };
  }).filter(g => g.items.length > 0);
  const anyTimed = timedGroups.length > 0;

  return (
    <div>
      <div style={{ textAlign: 'center', margin: '14px 0 18px' }}>
        <div style={{ fontSize: 13, color: '#A79FB4' }}>{fullDateLabel}</div>
        <div style={{ fontFamily: "'Jua'", fontSize: 26, color: '#514B5E', marginTop: 2 }}>통계 📊</div>
      </div>

      {/* 사람별 진행상황 */}
      {groups.length === 0 && (
        <div style={{ textAlign: 'center', color: '#B7AEC4', fontSize: 14, marginTop: 30 }}>오늘 할 일이 아직 없어 🌱</div>
      )}
      {groups.map(g => {
        const mt = meta(g.owner);
        const d = g.items.filter(t => t.done).length;
        const tot = g.items.length;
        const p = tot ? Math.round((d / tot) * 100) : 0;
        const deg = Math.round((p / 100) * 360);
        const ring = `conic-gradient(${mt.ring} ${deg}deg, #F1ECF4 ${deg}deg)`;
        return (
          <div key={g.owner} style={{ display: 'flex', alignItems: 'center', gap: 16, background: '#fff', borderRadius: 22, padding: '16px 18px', marginBottom: 14, boxShadow: '0 6px 18px rgba(150,120,170,.09)' }}>
            <div style={{ width: 88, height: 88, borderRadius: '50%', background: ring, display: 'flex', alignItems: 'center', justifyContent: 'center', flex: '0 0 auto' }}>
              <div style={{ width: 66, height: 66, borderRadius: '50%', background: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: "'Jua'", fontSize: 22, color: mt.ink }}>{p}%</div>
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
                <span style={{ background: mt.bg, width: 30, height: 30, borderRadius: '50%', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flex: '0 0 auto' }}>
                  <img src={mt.avatar} style={{ width: 22, height: 22 }} />
                </span>
                <span style={{ fontFamily: "'Jua'", fontSize: 17, color: mt.ink }}>{mt.who}</span>
              </div>
              <div style={{ fontSize: 13, color: '#7d738c', marginTop: 6 }}>{d} / {tot} 완료</div>
              <div style={{ fontSize: 12, color: '#A79FB4', marginTop: 2 }}>{personMsg(p)}</div>
            </div>
          </div>
        );
      })}

      {/* 예상 vs 실제 시간 (사람별) */}
      <div style={{ fontFamily: "'Jua'", fontSize: 16, color: '#514B5E', margin: '22px 2px 12px' }}>⏱ 예상 vs 실제</div>
      {!anyTimed ? (
        <div style={{ background: '#fff', borderRadius: 20, padding: '18px', textAlign: 'center', fontSize: 13, color: '#A79FB4', boxShadow: '0 6px 18px rgba(150,120,170,.08)' }}>
          아직 시간 기록이 없어.<br />오늘 탭에서 <b style={{ color: '#3E9E63' }}>▶ 시작</b>을 눌러 재보자 🌱
        </div>
      ) : (
        timedGroups.map(g => {
          const mt = meta(g.owner);
          return (
            <div key={g.owner} style={{ marginBottom: 18 }}>
              {/* 사람 헤더 + 합계 */}
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, margin: '0 2px 8px' }}>
                <span style={{ background: mt.bg, width: 26, height: 26, borderRadius: '50%', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flex: '0 0 auto' }}>
                  <img src={mt.avatar} style={{ width: 18, height: 18 }} />
                </span>
                <span style={{ fontFamily: "'Jua'", fontSize: 15, color: mt.ink }}>{mt.who}</span>
                {g.overall && <span style={{ marginLeft: 'auto', fontSize: 12, color: '#8a7a5f' }}>예상 <b>{fmtMin(g.est)}</b> · 실제 <b>{fmtMin(g.act)}</b> · <b style={{ color: g.overall.color }}>{g.overall.text}</b></span>}
              </div>
              {g.items.map(({ t, est, act }) => {
                const maxV = Math.max(est, act, 1);
                return (
                  <div key={t.id} style={{ background: '#fff', borderRadius: 18, padding: '13px 15px', marginBottom: 10, boxShadow: '0 4px 12px rgba(150,120,170,.08)' }}>
                    <div style={{ fontSize: 14, color: '#514B5E', marginBottom: 9 }}>{t.title}</div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
                      <span style={{ width: 34, fontSize: 11, color: '#6E7A9B' }}>예상</span>
                      <div style={{ flex: 1, height: 12, background: '#F1ECF4', borderRadius: 8, overflow: 'hidden' }}>
                        <div style={{ width: (est / maxV * 100) + '%', height: '100%', background: '#B9C2DE', borderRadius: 8 }}></div>
                      </div>
                      <span style={{ width: 42, textAlign: 'right', fontSize: 11, color: '#6E7A9B' }}>{fmtMin(est)}</span>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <span style={{ width: 34, fontSize: 11, color: '#E85D8A' }}>실제</span>
                      <div style={{ flex: 1, height: 12, background: '#F1ECF4', borderRadius: 8, overflow: 'hidden' }}>
                        <div style={{ width: (act / maxV * 100) + '%', height: '100%', background: 'linear-gradient(90deg,#FFC48F,#FF9EBB)', borderRadius: 8 }}></div>
                      </div>
                      <span style={{ width: 42, textAlign: 'right', fontSize: 11, color: '#E85D8A' }}>{fmtMin(act)}</span>
                    </div>
                    <div style={{ textAlign: 'right', fontSize: 11, fontWeight: 'bold', marginTop: 6, color: diffLabel(est, act).color }}>{diffLabel(est, act).text}</div>
                  </div>
                );
              })}
            </div>
          );
        })
      )}
    </div>
  );
}

/* ---------- 캘린더 (완료한 날 기준) ---------- */
function CalendarScreen({ todos, nowMs, onToggle, onLike, onHelp, onEdit, onDelete, onStartTimer, onStopTimer }) {
  const today = new Date();
  const [ym, setYm] = useState({ y: today.getFullYear(), m: today.getMonth() });
  const [sel, setSel] = useState({ y: today.getFullYear(), m: today.getMonth(), d: today.getDate() });

  const keyOf = (y, m, d) => y + '-' + m + '-' + d;
  const byDay = {};
  todos.forEach(t => {
    if (t.done && t.completedAt) {
      const dt = new Date(t.completedAt);
      const k = keyOf(dt.getFullYear(), dt.getMonth(), dt.getDate());
      (byDay[k] || (byDay[k] = [])).push(t);
    }
  });

  const prevM = () => setYm(s => s.m === 0 ? { y: s.y - 1, m: 11 } : { y: s.y, m: s.m - 1 });
  const nextM = () => setYm(s => s.m === 11 ? { y: s.y + 1, m: 0 } : { y: s.y, m: s.m + 1 });

  const firstDow = new Date(ym.y, ym.m, 1).getDay();
  const daysInMonth = new Date(ym.y, ym.m + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const isToday = (d) => today.getFullYear() === ym.y && today.getMonth() === ym.m && today.getDate() === d;
  const isSel = (d) => sel.y === ym.y && sel.m === ym.m && sel.d === d;
  const selItems = byDay[keyOf(sel.y, sel.m, sel.d)] || [];
  const dows = ['일', '월', '화', '수', '목', '금', '토'];

  return (
    <div>
      <div style={{ textAlign: 'center', margin: '14px 0 16px' }}>
        <div style={{ fontFamily: "'Jua'", fontSize: 26, color: '#514B5E' }}>캘린더 📆</div>
      </div>

      {/* 월 네비 */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', margin: '0 4px 12px' }}>
        <button onClick={prevM} style={{ background: '#F1ECF4', border: 'none', borderRadius: 12, width: 34, height: 34, fontSize: 16, color: '#7d738c', cursor: 'pointer' }}>‹</button>
        <div style={{ fontFamily: "'Jua'", fontSize: 18, color: '#514B5E' }}>{ym.y}년 {ym.m + 1}월</div>
        <button onClick={nextM} style={{ background: '#F1ECF4', border: 'none', borderRadius: 12, width: 34, height: 34, fontSize: 16, color: '#7d738c', cursor: 'pointer' }}>›</button>
      </div>

      {/* 요일 */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 4, marginBottom: 4 }}>
        {dows.map((w, i) => (
          <div key={w} style={{ textAlign: 'center', fontSize: 11, color: i === 0 ? '#E88AA6' : i === 6 ? '#8AA6D8' : '#A79FB4' }}>{w}</div>
        ))}
      </div>

      {/* 날짜 그리드 */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 4, marginBottom: 18 }}>
        {cells.map((d, i) => {
          if (d === null) return <div key={'e' + i}></div>;
          const cnt = (byDay[keyOf(ym.y, ym.m, d)] || []).length;
          const selected = isSel(d);
          return (
            <button key={d} onClick={() => setSel({ y: ym.y, m: ym.m, d })}
              style={{ position: 'relative', height: 42, borderRadius: 12, cursor: 'pointer', fontSize: 14, fontFamily: "'Gowun Dodum'",
                background: selected ? '#FF9EBB' : (cnt > 0 ? '#FFF0F4' : 'transparent'),
                color: selected ? '#fff' : '#514B5E',
                border: isToday(d) && !selected ? '2px solid #FFC9D8' : '2px solid transparent' }}>
              {d}
              {cnt > 0 && <span style={{ position: 'absolute', bottom: 5, left: '50%', transform: 'translateX(-50%)', width: 5, height: 5, borderRadius: '50%', background: selected ? '#fff' : '#FF9EBB' }}></span>}
            </button>
          );
        })}
      </div>

      {/* 선택한 날의 완료 목록 */}
      <div style={{ fontFamily: "'Jua'", fontSize: 15, color: '#514B5E', margin: '0 2px 10px' }}>
        {ym.m + 1}월 {sel.d}일 · 완료한 일 {selItems.length}개
      </div>
      {selItems.length === 0 ? (
        <div style={{ background: '#fff', borderRadius: 18, padding: '18px', textAlign: 'center', fontSize: 13, color: '#A79FB4', boxShadow: '0 4px 12px rgba(150,120,170,.08)' }}>이 날 완료한 일이 없어 🌱</div>
      ) : (
        selItems.map(t => (
          <TodoCard key={t.id} t={t} nowMs={nowMs} onToggle={onToggle} onLike={onLike} onHelp={onHelp} onStartTimer={onStartTimer} onStopTimer={onStopTimer} onEdit={onEdit} onDelete={onDelete} />
        ))
      )}
    </div>
  );
}

    const c = code.trim();

  return (
    <div className="phone" style={{ justifyContent: 'center', padding: '0 26px', gap: 0 }}>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textAlign: 'center' }}>

          <img src={AV.minseong} style={{ width: 56, height: 56, animation: 'float-y 3s ease-in-out infinite' }} />

        <div style={{ fontSize: 13, color: '#A79FB4', margin: '8px 0 26px', lineHeight: 1.5 }}>
          <b style={{ color: '#E85D8A' }}>커플 코드</b>를 입력하면<br />우리 할 일이 이어져요 💗
        </div>
        <input
          value={code}

          onKeyDown={(e) => { if (e.key === 'Enter') submit(); }}

        />

          onClick={submit}
          style={{ width: '100%', marginTop: 14, background: '#FF9EBB', border: 'none', color: '#fff', fontFamily: "'Jua'", fontSize: 18, padding: 16, borderRadius: 20, cursor: 'pointer', boxShadow: '0 10px 22px rgba(255,158,187,.4)' }}>
          시작하기 💕
        </button>

    </div>
  );
}

/* ============================================================
 *  앱 루트
 * ============================================================ */
function App() {
  const [coupleId, setCoupleId] = useState(() => localStorage.getItem('couple52_48:id') || '');
  const [tab, setTab] = useState('home');
  const [todos, setTodos] = useState([]);
  const [celebrate, setCelebrate] = useState(null);
  const [ready, setReady] = useState(false);
  const [nowMs, setNowMs] = useState(Date.now());
  const storeRef = useRef(null);
  const celebrateTimer = useRef(null);

  // 실행 중인 타이머 라이브 갱신 (1초마다)
  useEffect(() => {
    const id = setInterval(() => setNowMs(Date.now()), 1000);
    return () => clearInterval(id);
  }, []);

  // 커플 코드가 정해지면 데이터 스토어 연결
  useEffect(() => {
    if (!coupleId) return;
    let unsub = () => {};
    let cancelled = false;
    (async () => {
      let store;
      if (isFirebaseConfigured && db) {
        try { await auth.signInAnonymously(); } catch (e) { console.error('익명 로그인 실패:', e); }
        store = makeFirestore(coupleId);
      } else {
        store = makeLocalStore(coupleId);
      }
      if (cancelled) return;
      storeRef.current = store;
      unsub = store.subscribe((list) => { setTodos(list); setReady(true); });
    })();
    return () => { cancelled = true; try { unsub(); } catch {} };
  }, [coupleId]);

  const fireCelebrate = useCallback((t) => {
    const mt = meta(t.owner);
    const i = Math.floor(Math.random() * CELEBRATE_MSGS.length);
    setCelebrate({ avatar: mt.avatar, msg: CELEBRATE_MSGS[i], sub: `${mt.who}, ${CELEBRATE_SUBS[i]}` });
    clearTimeout(celebrateTimer.current);
    celebrateTimer.current = setTimeout(() => setCelebrate(null), 1900);
  }, []);

  const onToggle = useCallback((t) => {
    const next = !t.done;
    storeRef.current && storeRef.current.update(t.id, { done: next, completedAt: next ? Date.now() : null });
    if (next) fireCelebrate(t);
  }, [fireCelebrate]);

  const onLike = useCallback((t) => {
    const reactions = (t.reactions || []).includes('💖') ? t.reactions : [ ...(t.reactions || []), '💖' ];
    storeRef.current && storeRef.current.update(t.id, { reactions });
  }, []);

  const onHelp = useCallback((t) => {
    storeRef.current && storeRef.current.update(t.id, { needHelp: !t.needHelp });
  }, []);

  const onAdd = useCallback((partial) => {
    storeRef.current && storeRef.current.add({ done: false, streak: 0, needHelp: false, reactions: [], estMin: null, actualSec: 0, timerStart: null, ...partial });
  }, []);

  const onStartTimer = useCallback((t) => {
    storeRef.current && storeRef.current.update(t.id, { timerStart: Date.now() });
  }, []);
  const onStopTimer = useCallback((t) => {
    const add = t.timerStart ? Math.max(0, (Date.now() - t.timerStart) / 1000) : 0;
    storeRef.current && storeRef.current.update(t.id, { actualSec: (t.actualSec || 0) + add, timerStart: null });
  }, []);

  const onEdit = useCallback((t, patch) => {
    storeRef.current && storeRef.current.update(t.id, patch);
  }, []);
  const onDelete = useCallback((t) => {
    storeRef.current && storeRef.current.remove(t.id);
  }, []);

  const handlePair = (code) => {
    localStorage.setItem('couple52_48:id', code);
    setCoupleId(code);
  };
  const changeCouple = () => {
    if (typeof window !== 'undefined' && window.confirm && !window.confirm('코드 입력 화면으로 나갈까요?')) return;
    localStorage.removeItem('couple52_48:id');
    setCoupleId(''); setTodos([]); setReady(false); setTab('home');
  };

  // 날짜 / 미완료 자동 이월
  const now = new Date();
  const isToday = (ts) => {
    if (!ts) return false;
    const d = new Date(ts);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
  };
  // 오늘 보이는 목록: 미완료는 날짜와 무관하게 계속(=이월), 완료는 오늘 완료한 것만.
  const visibleTodos = todos.filter(t => !t.done || isToday(t.completedAt));

  const dow = ['일', '월', '화', '수', '목', '금', '토'][now.getDay()];
  const dateLabel = `오늘 ${now.getMonth() + 1}월 ${now.getDate()}일 ${dow}`;
  const fullDateLabel = `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 ${dow}요일`;

  if (!coupleId) return <PairingScreen onSubmit={handlePair} />;

  const tabs = [
    { key: 'home', icon: '📋', label: '오늘' },
    { key: 'calendar', icon: '📆', label: '캘린더' },
    { key: 'stats', icon: '📊', label: '통계' },
  ];

  return (
    <div className="phone">
      <div style={{ position: 'absolute', bottom: 2, left: 8, fontSize: 9, color: '#D9D2E0', zIndex: 5, pointerEvents: 'none' }}>{APP_VERSION}</div>
      <Celebration data={celebrate} />

      <div style={{ flex: '1 1 auto', overflowY: 'auto', paddingTop: 'calc(16px + env(safe-area-inset-top))', paddingLeft: 18, paddingRight: 18, paddingBottom: 20 }}>
        {!ready && <div style={{ textAlign: 'center', color: '#B7AEC4', marginTop: 40 }}>불러오는 중… 💗</div>}
        {ready && tab === 'home' && <HomeScreen todos={visibleTodos} nowMs={nowMs} dateLabel={dateLabel} onToggle={onToggle} onLike={onLike} onHelp={onHelp} onAdd={onAdd} onStartTimer={onStartTimer} onStopTimer={onStopTimer} onEdit={onEdit} onDelete={onDelete} />}
        {ready && tab === 'stats' && <StatsScreen todos={visibleTodos} nowMs={nowMs} fullDateLabel={fullDateLabel} />}
        {ready && tab === 'calendar' && <CalendarScreen todos={todos} nowMs={nowMs} onToggle={onToggle} onLike={onLike} onHelp={onHelp} onEdit={onEdit} onDelete={onDelete} onStartTimer={onStartTimer} onStopTimer={onStopTimer} />}
      </div>

      {/* 하단 네비 */}
      <div style={{ flex: '0 0 auto', background: '#fff', borderTop: '1px solid #F1EAF3', display: 'flex', paddingTop: 8, paddingLeft: 8, paddingRight: 8, paddingBottom: 'calc(14px + env(safe-area-inset-bottom))' }}>
        {tabs.map(d => {
          const active = tab === d.key;
          return (
            <button key={d.key} onClick={() => setTab(d.key)} style={{ flex: 1, background: 'none', border: 'none', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3, padding: '6px 0' }}>
              <span style={{ fontSize: 22, filter: active ? 'none' : 'grayscale(.4) opacity(.55)' }}>{d.icon}</span>
              <span style={{ fontFamily: "'Jua'", fontSize: 11, color: active ? '#FF9EBB' : '#B7AEC4' }}>{d.label}</span>
            </button>
          );
        })}
        <button onClick={changeCouple} title="코드 변경" style={{ flex: 1, background: 'none', border: 'none', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3, padding: '6px 0' }}>
          <span style={{ fontSize: 22, filter: 'grayscale(.4) opacity(.55)' }}>⚙️</span>
          <span style={{ fontFamily: "'Jua'", fontSize: 11, color: '#B7AEC4' }}>코드 변경</span>
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<!-- classic JSX 런타임(React.createElement)으로 명시 변환 후 실행 -->
<script>
(function () {
  var src = document.getElementById('app-src').textContent;
  try {
    var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
    (0, eval)(out);
  } catch (e) {
    document.getElementById('root').innerHTML =
      '<div style="padding:24px;font-family:sans-serif;color:#c0392b">앱 로드 오류: ' + e.message + '</div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
